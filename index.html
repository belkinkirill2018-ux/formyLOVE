<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест для моей любимой <3</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comfortaa', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Анимированные плавающие сердечки на фоне */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 35px 25px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(230, 57, 70, 0.2), 0 0 20px rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(255, 182, 193, 0.6);
      text-align: center;
      position: relative;
      z-index: 10;
      transition: all 0.4s ease;
    }

    h1 {
      color: #e63946;
      font-size: 1.8rem;
      margin-bottom: 15px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      color: #555;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
      transition: all 0.3s ease;
      outline: none;
      margin-top: 10px;
      display: inline-block;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 25px rgba(255, 65, 108, 0.5);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Прогресс бар */
    .progress-container {
      width: 100%;
      background: #ffe6e8;
      height: 14px;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      width: 0%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Вопросы и варианты ответов */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #ffccd5;
      color: #4a4a4a;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      font-weight: 500;
    }

    .option-btn:hover {
      background: #fff0f3;
      border-color: #ff416c;
      transform: scale(1.01);
    }

    .option-btn.wrong {
      background-color: #ffe5e5;
      border-color: #ff4d4d;
      color: #cc0000;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Сердце с фотографией на финальном экране */
    .heart-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 25px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-shape {
      width: 100%;
      height: 100%;
      background-color: #ff416c;
      clip-path: path('M 140 250 C 140 250 20 170 20 90 C 20 40 60 10 105 10 C 130 10 140 30 140 30 C 140 30 150 10 175 10 C 220 10 260 40 260 90 C 260 170 140 250 140 250 Z');
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Рамка из текста "Люблю тебя, киса <3" */
    .text-border-heart {
      position: absolute;
      width: 320px;
      height: 320px;
      top: -20px;
      left: -20px;
      pointer-events: none;
    }

    .text-border-heart svg {
      width: 100%;
      height: 100%;
    }

    .text-border-heart text {
      fill: #ff2a55;
      font-family: 'Caveat', cursive;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .user-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: path('M 140 250 C 140 250 20 170 20 90 C 20 40 60 10 105 10 C 130 10 140 30 140 30 C 140 30 150 10 175 10 C 220 10 260 40 260 90 C 260 170 140 250 140 250 Z');
    }

    .hidden {
      display: none !important;
    }

    .fade-in {
      animation: fadeIn 0.5s ease forward;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Контейнер приложения -->
  <div class="container" id="quiz-container">
    
    <!-- Экран 1: Приветствие -->
    <div id="start-screen" class="fade-in">
      <h1>Тест для моей любимой &lt;3</h1>
      <p class="subtitle">Привет, Крисик! Этот тест специально для тебя, я верю что ты его пройдешь, мой котенок &lt;3</p>
      <button class="btn" onclick="startQuiz()">Начать тест 💕</button>
    </div>

    <!-- Экран 2: Тест -->
    <div id="quiz-screen" class="hidden">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 id="question-title" style="color: #333; margin-bottom: 15px; font-size: 1.3rem;">Вопрос</h2>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Экран 3: Финал -->
    <div id="final-screen" class="hidden fade-in">
      <h1>Ты прошла тест! 🎉</h1>
      <p class="subtitle" style="margin-bottom: 10px;">Я ни на секунду в тебе не сомневался!</p>

      <!-- Сердце с текстом и фото -->
      <div class="heart-wrapper">
        <!-- Анимированная рамочка из текста "Люблю тебя, киса <3" по форме сердца -->
        <div class="text-border-heart">
          <svg viewBox="0 0 300 300">
            <path id="heartPath" fill="none" d="M 150 260 C 150 260 20 175 20 90 C 20 35 65 5 112 5 C 138 5 150 25 150 25 C 150 25 162 5 188 5 C 235 5 280 35 280 90 C 280 175 150 260 150 260 Z" />
            <text>
              <textPath href="#heartPath" startOffset="0%">
                Люблю тебя, киса &lt;3 Люблю тебя, киса &lt;3 Люблю тебя, киса &lt;3 Люблю тебя, киса &lt;3 Люблю тебя, киса &lt;3
              </textPath>
            </text>
          </svg>
        </div>

        <!-- Картинка внутри сердца -->
        <img id="final-photo" class="user-photo" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80" alt="Наша фотография">
      </div>
    </div>

  </div>

    const questions = [
      {
        question: "Где было наше самое первое свидание?",
        options: [
          { text: "В кино на последнем ряду", correct: false },
          { text: "В парке на скамейке", correct: false },

        ]
      }

    let currentQuestionIndex = 0;

    // Генерация сердечек на фоне
    function createBgHearts() {
      const heartSymbols = ['❤️', '💖', '💕', '💗', '🌸'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('bg-heart');
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.body.appendChild(heart);
      }
    }

    function startQuiz() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('quiz-screen').classList.add('fade-in');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById('question-title').innerText = q.question;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      // Обновляем прогресс бар
      const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = progressPercent + '%';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.innerText = opt.text;
        btn.onclick = () => handleAnswer(opt.correct, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect, buttonElement) {
      if (isCorrect) {
        // Конфетти при правильном ответе
        confetti({
          particleCount: 30,
          spread: 60,
          origin: { y: 0.7 },
          colors: ['#ff416c', '#ff4b2b', '#ff7eb3']
        });

        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
          setTimeout(showQuestion, 400);
        } else {
          document.getElementById('progress-bar').style.width = '100%';
          setTimeout(showFinalScreen, 600);
        }
      } else {
        buttonElement.classList.add('wrong');
        setTimeout(() => {
          buttonElement.classList.remove('wrong');
        }, 500);
      }
    }

    function showFinalScreen() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('final-screen').classList.remove('hidden');

      // Устанавливаем фотографию
      if (YOUR_PHOTO_URL && YOUR_PHOTO_URL.trim() !== "") {
        document.getElementById('final-photo').src = YOUR_PHOTO_URL;
      }

      // Большой праздничный салют
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff416c', '#ff7eb3', '#ffffff']
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff416c', '#ff7eb3', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Запуск анимации сердечек
    createBgHearts();
  </script>
</body>
</html>
